version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - go-task --list

  upgrade:
    desc: Upgrade the system via rpm-ostree (reboot required)
    cmds:
      - rpm-ostree upgrade

  install-desktop:
    desc: Install system packages for desktop (reboot required)
    cmds:
      - rpm-ostree install
        jetbrains-mono-fonts-all
        gnome-shell-extension-appindicator
        gnome-shell-extension-dash-to-dock
        gnome-shell-extension-system-monitor-applet
        gnome-tweaks
        adw-gtk3-theme
        papirus-icon-theme
        libreoffice-icon-theme-papirus
        fuse
        fuse-libs
        zsh
        git
        fastfetch
        powerline-fonts
        zsh-autosuggestions
        zsh-syntax-highlighting
        vim
        solaar

  install-laptop:
    desc: Install system packages for laptop (reboot required)
    cmds:
      - rpm-ostree install
        jetbrains-mono-fonts-all
        gnome-shell-extension-appindicator
        gnome-shell-extension-dash-to-dock
        gnome-shell-extension-system-monitor-applet
        gnome-tweaks
        adw-gtk3-theme
        papirus-icon-theme
        libreoffice-icon-theme-papirus
        fuse
        fuse-libs
        zsh
        git
        fastfetch
        powerline-fonts
        zsh-autosuggestions
        zsh-syntax-highlighting
        vim
        tailscale

  toolbox:
    desc: Create devops toolbox container
    cmds:
      - toolbox create --image ghcr.io/whilcayangyang/whil-docker-images/fedora-devops-toolbox:latest devops

  flatpak-config:
    desc: Configure Flatpak remotes (enable & prioritize Flathub)
    cmds:
      - sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - sudo flatpak remote-modify --enable flathub
      - sudo flatpak remote-modify --system flathub --prio=1
      - sudo flatpak remote-modify --system fedora --prio=0
      - gsettings set org.gnome.software packaging-format-preference "['flatpak', 'rpm']"

  flatpak-install-desktop:
    desc: Install Flatpak applications from Flathub
    cmds:
      - flatpak install -y flathub
        org.gtk.Gtk3theme.adw-gtk3
        org.gtk.Gtk3theme.adw-gtk3-dark
        org.libreoffice.LibreOffice
        com.visualstudio.code
        com.bitwarden.desktop
        com.brave.Browser
        com.mikrotik.WinBox
        org.gimp.GIMP
        com.slack.Slack
        com.jgraph.drawio.desktop
        it.mijorus.gearlever
        com.github.tchx84.Flatseal
        org.videolan.VLC
        org.kde.kdenlive
        org.ardour.Ardour
        io.gitlab.adhami3310.Impression
        de.haeckerfelix.Fragments
        page.codeberg.tahoso.azul-box
        me.iepure.devtoolbox
        io.github.flattool.Warehouse

  flatpak-install-laptop:
    desc: Install Flatpak applications from Flathub (laptop only)
    cmds:
      - flatpak install -y flathub
        org.gtk.Gtk3theme.adw-gtk3
        org.gtk.Gtk3theme.adw-gtk3-dark
        org.libreoffice.LibreOffice
        com.visualstudio.code
        com.bitwarden.desktop
        com.brave.Browser
        com.mikrotik.WinBox
        org.gimp.GIMP
        com.slack.Slack
        com.jgraph.drawio.desktop
        it.mijorus.gearlever
        com.github.tchx84.Flatseal
        org.videolan.VLC
        io.gitlab.adhami3310.Impression
        de.haeckerfelix.Fragments
        page.codeberg.tahoso.azul-box
        me.iepure.devtoolbox
        io.github.flattool.Warehouse
        dev.deedles.Trayscale

  ohmyzsh:
    desc: Install Oh My Zsh and configure .zshrc
    cmds:
      - sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      - sed -i '/source $ZSH\/oh-my-zsh.sh/ a\source \/usr\/share\/zsh-autosuggestions\/zsh-autosuggestions.zsh' ~/.zshrc
      - sed -i '/source $ZSH\/oh-my-zsh.sh/ a\source \/usr\/share\/zsh-syntax-highlighting\/zsh-syntax-highlighting.zsh' ~/.zshrc
      - sed -i 's/plugins=(git)/plugins=(ansible fluxcd git k9s kubectl tailscale terraform)/' ~/.zshrc
      - sed -i '$a\' ~/.zshrc
      - |
        cat >> ~/.zshrc << 'EOF'
        export PATH="$HOME/.local/bin:$PATH"
        alias claude='toolbox run --container devops $HOME/.local/bin/claude'
        alias kubectl='toolbox run --container devops kubectl'
        alias k9s='toolbox run --container devops k9s'
        alias talosctl='toolbox run --container devops talosctl'
        alias terraform='toolbox run --container devops terraform'
        fastfetch
        EOF

  auto-theme-switcher:
    desc: Set up systemd user timers to switch GNOME theme (light at 6AM, dark at 8PM)
    cmds:
      - mkdir -p ~/.config/systemd/user
      - |
        cat > ~/.config/systemd/user/theme-light.service << 'EOF'
        [Unit]
        Description=Switch to light theme
        After=graphical-session.target

        [Service]
        Type=oneshot
        Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%U/bus
        ExecStart=/bin/bash -c 'h=$(date +%%H); if [ "$h" -ge 6 ] && [ "$h" -lt 20 ]; then gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3 && gsettings set org.gnome.desktop.interface color-scheme default; fi'
        EOF
      - |
        cat > ~/.config/systemd/user/theme-light.timer << 'EOF'
        [Unit]
        Description=Light theme at 6AM

        [Timer]
        OnCalendar=*-*-* 06:00:00
        Persistent=true

        [Install]
        WantedBy=timers.target
        EOF
      - |
        cat > ~/.config/systemd/user/theme-dark.service << 'EOF'
        [Unit]
        Description=Switch to dark theme
        After=graphical-session.target

        [Service]
        Type=oneshot
        Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%U/bus
        ExecStart=/bin/bash -c 'h=$(date +%%H); if [ "$h" -ge 20 ] || [ "$h" -lt 6 ]; then gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark && gsettings set org.gnome.desktop.interface color-scheme prefer-dark; fi'
        EOF
      - |
        cat > ~/.config/systemd/user/theme-dark.timer << 'EOF'
        [Unit]
        Description=Dark theme at 8PM

        [Timer]
        OnCalendar=*-*-* 20:00:00
        Persistent=true

        [Install]
        WantedBy=timers.target
        EOF
      - systemctl --user daemon-reload
      - systemctl --user enable --now theme-light.timer theme-dark.timer

  bluetooth-autostart-disable:
    desc: Disable Bluetooth autostart (laptop only)
    cmds:
      - sudo sed -i 's/^#*AutoEnable=.*/AutoEnable=false/' /etc/bluetooth/main.conf

  ssh-enable:
    desc: Configure and enable SSH daemon with secure defaults
    cmds:
      - sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#\(PubkeyAuthentication yes\)/\1/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#\(PermitEmptyPasswords no\)/\1/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#\(LoginGraceTime 2m\)/\1/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#\(MaxAuthTries 6\)/\1/' /etc/ssh/sshd_config
      - sudo sed -i 's/^#\(MaxSessions 10\)/\1/' /etc/ssh/sshd_config
      - sudo systemctl enable --now sshd.service

  luks-tpm2-enroll:
    desc: Enroll TPM2 key for LUKS auto-unlock on boot (laptop only)
    vars:
      LUKS_DEV:
        sh: lsblk -rno NAME,FSTYPE | grep crypto_LUKS | awk '{print $1}'
    cmds:
      - sudo systemd-cryptenroll --wipe-slot tpm2
        --tpm2-device auto
        --tpm2-pcrs "0+1+2+7"
        /dev/{{.LUKS_DEV}}

  update-initramfs:
    desc: Update initramfs to include TPM2 support for LUKS auto-unlock (reboot required)
    cmds:
      - sudo sed -i '/tpm2-device/! s/discard/discard,tpm2-device=auto/' /etc/crypttab
      - rpm-ostree initramfs --enable

  install-virt:
    desc: Install virtualization packages via rpm-ostree (reboot required)
    cmds:
      - rpm-ostree install
        virt-manager
        qemu-kvm
        libvirt
        libvirt-daemon-config-network
        virt-install
        bridge-utils

  config-virt:
    desc: Enable libvirtd and add user to libvirt group (reboot required)
    cmds:
      - sudo systemctl enable --now libvirtd
      - sudo grep -E '^libvirt:' /usr/lib/group | sudo tee -a /etc/group
      - sudo grep -E '^kvm:' /usr/lib/group | sudo tee -a /etc/group
      - sudo usermod -aG libvirt,kvm $USER

  firmware-update:
    desc: Refresh metadata and apply firmware updates via fwupd
    cmds:
      - sudo fwupdmgr refresh
      - sudo fwupdmgr get-devices
      - sudo fwupdmgr get-updates
      - sudo fwupdmgr update

  setup-desktop:
    desc: Full desktop setup (flatpak, ohmyzsh, auto-theme-switcher)
    cmds:
      - task: flatpak-config
      - task: flatpak-install-desktop
      - task: ohmyzsh
      - task: auto-theme-switcher

  setup-laptop:
    desc: Full laptop setup (flatpak, ohmyzsh, auto-theme-switcher, bluetooth)
    cmds:
      - task: flatpak-config
      - task: flatpak-install-laptop
      - task: ohmyzsh
      - task: auto-theme-switcher
      - task: bluetooth-autostart-disable
